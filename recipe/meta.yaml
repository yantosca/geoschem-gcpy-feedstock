{% set name = "geoschem-gcpy" %}
{% set version = "1.8.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 5692a7865c42e2b9d90819b28d2b75ae9f62ac4890df74f4f836d7555fa96889

build:
  number: 0
  skip: true  # [win]
  script_env:
    - MPLBACKEND=agg
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python
    - pip
    - numpy
    - setuptools
    - cartopy
    # Pin to ESMF 8.9.1 and xesmf 0.9.2 to avoid import errors
    - esmf =8.9.1
    - esmpy =8.9.1
    - xesmf =0.9.2
  run:
    - python
    - cartopy
    - cf_xarray
    - dask
    # Pin to ESMF 8.9.1 to avoid import errors
    - esmf =8.9.1
    - esmpy =8.9.1
    - gridspec
    - joblib
    - matplotlib-base
    - netcdf4
    - netcdf-fortran
    - {{ pin_compatible('numpy') }}
    - pandas
    - pip
    - pylint
    - pypdf
    - pyproj
    - requests
    - scipy
    - sparselt
    - tabulate
    - tk
    - xarray
    # Pin to xesmf 0.9.2 to avoid import errors
    - xesmf =0.9.2

test:
  imports:
    - gcpy
  requires:
    - esmf =8.9.1
    - esmpy =8.9.1
    - xesmf =0.9.2

about:
  home: https://github.com/geoschem/gcpy
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Python toolkit for working with GEOS-Chem output and input
  doc_url: https://gcpy.readthedocs.io/en/latest/
  dev_url: https://github.com/geoschem/gcpy

extra:
  recipe-maintainers:
    - yantosca
    - lizziel
    - msulprizio
